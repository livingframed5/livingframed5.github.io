<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useCallback } = React;

/* ════════════════════════════════════════════════════════════════════════════
   MARGIN LEAK REPORT — simple dashboard for small contractors.
   Four working tabs:
     1. Overview        — 4 big numbers + top 3 leaks + hours chart
     2. Projects        — every active job, biggest problems first
     3. Money to Bill   — unbilled work with one-click "Mark billed"
     4. Guide           — how to use this, in plain English
   Plain language on purpose: "On Track / Watch Out / Losing Money".
   ════════════════════════════════════════════════════════════════════════════ */

const LABOR_RATE = 62;

const MODE_OPTIONS = [
  { key: "demo", label: "Demo", icon: "leaf", sub: "Hardcoded sample data" },
  { key: "live", label: "Live", icon: "store", sub: "Connected to Airtable" },
];

const SEED_PROJECTS = [
  {
    id: "p1", name: "Oak Street Landscaping", client: "W. Marcus Property Mgmt", icon: "leaf", tag: "Landscaping",
    estHours: 86, actualHours: 100,
    materialBudget: 3400, materialActual: 4020,
    contract: 18500, targetMargin: 34, currentMargin: 27, health: "critical",
    changeOrders: [
      { id: "CO-104", title: "Retaining wall +100 sq ft", amount: 1950, status: "unsigned" },
    ],
  },
  {
    id: "p2", name: "Downtown Retail Remodel", client: "Alder & Stone Retail", icon: "store", tag: "Remodel",
    estHours: 240, actualHours: 296,
    materialBudget: 21500, materialActual: 26875,
    contract: 78400, targetMargin: 38, currentMargin: 30, health: "critical",
    changeOrders: [
      { id: "CO-207", title: "Mezzanine stair + fireproofing", amount: 7200, status: "pending" },
      { id: "CO-208", title: "Casework for back-of-house", amount: 3200, status: "unsigned" },
      { id: "CO-209", title: "Client-selected fixtures", amount: 2000, status: "pending" },
    ],
  },
  {
    id: "p3", name: "Hillsdale Deck Build", client: "R. Covington", icon: "hammer", tag: "Deck",
    estHours: 64, actualHours: 61,
    materialBudget: 4800, materialActual: 4655,
    contract: 22600, targetMargin: 39, currentMargin: 41, health: "healthy",
    changeOrders: [],
  },
  {
    id: "p4", name: "Commercial Irrigation Fix", client: "W. Marcus Property Mgmt", icon: "droplet", tag: "Irrigation",
    estHours: 30, actualHours: 36,
    materialBudget: 1150, materialActual: 1310,
    contract: 7400, targetMargin: 44, currentMargin: 40, health: "warning",
    changeOrders: [
      { id: "CO-118", title: "Zone 4 valve replacement", amount: 760, status: "unsigned" },
    ],
  },
  {
    id: "p5", name: "Northfield Fence Replacement", client: "Hearthstone HOA", icon: "fence", tag: "Fence",
    estHours: 58, actualHours: 55,
    materialBudget: 2900, materialActual: 2880,
    contract: 14900, targetMargin: 36, currentMargin: 37, health: "healthy",
    changeOrders: [],
  },
  {
    id: "p6", name: "Cherry Grove Paver Patio", client: "D. & M. Okonkwo", icon: "layout-grid", tag: "Hardscape",
    estHours: 95, actualHours: 104,
    materialBudget: 6200, materialActual: 6820,
    contract: 19300, targetMargin: 42, currentMargin: 38, health: "warning",
    changeOrders: [
      { id: "CO-212", title: "Extra paver accent border", amount: 1200, status: "unsigned" },
    ],
  },
  {
    id: "p7", name: "Lincoln Ave Interior Paint", client: "B. Hayes", icon: "paint-roller", tag: "Paint",
    estHours: 140, actualHours: 138,
    materialBudget: 2350, materialActual: 2305,
    contract: 17850, targetMargin: 45, currentMargin: 46, health: "healthy",
    changeOrders: [],
  },
  {
    id: "p8", name: "Sunset St. Pool Resurface", client: "Harborview Realty", icon: "waves", tag: "Pool",
    estHours: 160, actualHours: 192,
    materialBudget: 15800, materialActual: 18140,
    contract: 41200, targetMargin: 40, currentMargin: 33, health: "critical",
    changeOrders: [
      { id: "CO-301", title: "Coping tile upgrade", amount: 3300, status: "pending" },
      { id: "CO-302", title: "Extra coating allowance", amount: 2550, status: "pending" },
    ],
  },
];

const laborFor = (p) => ({ est: p.estHours * LABOR_RATE, act: p.actualHours * LABOR_RATE });
const variance = (p) => { const l = laborFor(p); const d = l.act - l.est; return { $: d, hrs: p.actualHours - p.estHours, pct: l.est ? d / l.est * 100 : 0 }; };
const overrun  = (p) => ({ $: p.materialActual - p.materialBudget });
const unbilled = (p) => p.changeOrders.filter((c) => c.status !== "invoiced").reduce((s, c) => s + c.amount, 0);
const openCOs  = (p) => p.changeOrders.filter((c) => c.status !== "invoiced");

const usd = (v) => (v < 0 ? "-" : "") + "$" + Math.abs(v).toLocaleString("en-US", { maximumFractionDigits: 0 });
const hoursFmt = (v) => v.toLocaleString("en-US") + "h";

const HEALTH_META = {
  healthy:  { label: "On Track",      dot: "bg-emerald-500", chip: "bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200", bar: "bg-emerald-500", text: "text-emerald-600" },
  warning:  { label: "Watch Out",     dot: "bg-amber-500",   chip: "bg-amber-50 text-amber-700 ring-1 ring-amber-200",     bar: "bg-amber-500",   text: "text-amber-600" },
  critical: { label: "Losing Money",  dot: "bg-rose-500",    chip: "bg-rose-50 text-rose-700 ring-1 ring-rose-200",        bar: "bg-rose-500",    text: "text-rose-600" },
};

const CO_STATUS_META = {
  unsigned: { label: "Not signed yet", chip: "bg-slate-100 text-slate-500 ring-1 ring-slate-200" },
  pending:  { label: "Signed — ready to bill", chip: "bg-amber-50 text-amber-700 ring-1 ring-amber-200" },
  invoiced: { label: "Billed", chip: "bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200" },
};

function leakScore(p) {
  const v = variance(p);
  const o = overrun(p);
  return Math.max(0, v.$) + Math.max(0, o.$) + unbilled(p);
}

function Icon({ name, size = 14, className }) {
  return <i data-lucide={name} style={{ width: size, height: size }} className={"shrink-0 " + (className || "")} />;
}

function Pill({ className, children }) {
  return <span className={"inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-[11px] font-semibold leading-4 " + className}>{children}</span>;
}

function HealthBadge({ health, pulse }) {
  const m = HEALTH_META[health];
  return (
    <Pill className={m.chip}>
      <span className={"h-1.5 w-1.5 rounded-full " + m.dot + (pulse ? " animate-pulse" : "")} />{m.label}
    </Pill>
  );
}

/* ═══════════ TAB 1 · OVERVIEW ═══════════ */
function KpiCards({ m, onGo }) {
  const pct = Math.round(m.booked / m.target * 100);
  return (
    <section className="grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">
      <article className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <span className="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
          <Icon name="receipt" size={13} className="text-slate-400" /> Work Booked
        </span>
        <p className="mt-2 text-[26px] font-extrabold tracking-tight tabular-nums text-ink">{usd(m.booked)}</p>
        <p className="text-[11px] text-slate-500">{m.active} active jobs</p>
        <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-100">
          <div className="h-full rounded-full bg-emerald-500 bar-grow" style={{ width: Math.min(100, pct) + "%" }} />
        </div>
        <p className="mt-1.5 text-[10.5px] font-medium text-slate-400">{pct}% of {usd(m.target)} goal</p>
      </article>

      <article className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <span className="flex items-center justify-between">
          <span className="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
            <Icon name="timer" size={13} className="text-slate-400" /> Labor Over Budget
          </span>
          {m.laborOver > 0 && (
            <Pill className="bg-rose-50 text-rose-700 ring-1 ring-rose-200"><span className="h-1.5 w-1.5 animate-pulse rounded-full bg-rose-500" />Over</Pill>
          )}
        </span>
        <p className={"mt-2 text-[26px] font-extrabold tracking-tight tabular-nums " + (m.laborOver > 0 ? "text-rose-600" : "text-ink")}>{m.laborOver > 0 ? "+" : ""}{usd(m.laborOver)}</p>
        <p className="text-[11px] text-slate-500">{m.hoursDelta} extra hours past the estimate</p>
        <p className={"mt-2.5 text-[10.5px] font-medium " + (m.laborOver > 0 ? "text-rose-600" : "text-slate-400")}>
          {m.laborOver > 0 ? "Crews working more hours than quoted" : "Crews on or under estimate"}
        </p>
      </article>

      <button onClick={() => onGo("money")} className="rounded-2xl border border-slate-200 bg-white p-4 text-left shadow-sm transition-colors hover:border-amber-300 hover:bg-amber-50/40">
        <span className="flex items-center justify-between">
          <span className="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
            <Icon name="file-text" size={13} className="text-slate-400" /> Money to Bill
          </span>
          <Icon name="chevron-right" size={14} className="text-slate-300" />
        </span>
        <p className="mt-2 text-[26px] font-extrabold tracking-tight tabular-nums text-amber-600">{usd(m.unbilled)}</p>
        <p className="text-[11px] text-slate-500">{m.openCOs} unbilled change order{m.openCOs === 1 ? "" : "s"}</p>
        <p className="mt-2.5 text-[10.5px] font-medium text-amber-600">Tap to bill it →</p>
      </button>

      <article className="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
        <span className="flex items-center gap-1.5 text-[11px] font-semibold uppercase tracking-wide text-slate-500">
          <Icon name="gauge" size={13} className="text-slate-400" /> Avg Profit Margin
        </span>
        <p className="mt-2 text-[26px] font-extrabold tracking-tight tabular-nums text-ink">{m.avgMargin.toFixed(1)}%</p>
        <p className="text-[11px] text-slate-500">Goal {m.avgGoal.toFixed(0)}%</p>
        <div className="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-100">
          <div className="h-full rounded-full bg-violet-500 bar-grow" style={{ width: Math.min(100, m.avgMargin / Math.max(1, m.avgGoal) * 100) + "%" }} />
        </div>
        <p className={"mt-1.5 text-[10.5px] font-medium " + (m.avgMargin < m.avgGoal ? "text-rose-600" : "text-emerald-600")}>
          {m.avgMargin < m.avgGoal ? (m.avgGoal - m.avgMargin).toFixed(1) + " pts below goal" : "At or above goal"}
        </p>
      </article>
    </section>
  );
}

function AttentionList({ projects, onOpen }) {
  const top = useMemo(() =>
    projects
      .map((p) => ({ p, score: leakScore(p), why: whyText(p) }))
      .filter((x) => x.score > 0)
      .sort((a, b) => b.score - a.score)
      .slice(0, 3),
    [projects]);

  return (
    <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <h3 className="mb-1 flex items-center gap-1.5 text-[13px] font-bold text-ink">
        <Icon name="zap" size={14} className="text-amber-500" /> Top Leaks This Week
      </h3>
      <p className="mb-4 text-[11px] text-slate-500">Biggest problems first — tap a job for details.</p>
      <div className="space-y-2.5">
        {top.map(({ p, why, score }) => (
          <button key={p.id} onClick={() => onOpen(p)}
            className={"group w-full rounded-xl border p-3 text-left transition-transform hover:-translate-y-px " +
              (p.health === "critical" ? "border-rose-200 bg-rose-50/70" : "border-amber-200 bg-amber-50/70")}>
            <div className="flex items-center justify-between gap-2">
              <span className="text-[12px] font-bold text-slate-800">{p.name}</span>
              <span className={'text-[12px] font-extrabold tabular-nums ' + (p.health === "critical" ? "text-rose-600" : "text-amber-600")}>{usd(score)} at risk</span>
            </div>
            <p className="mt-1 text-[11px] leading-snug text-slate-500">{why}</p>
          </button>
        ))}
        {top.length === 0 && <p className="text-[12px] text-slate-400">No leaks — every job is on track.</p>}
      </div>
    </div>
  );
}

function whyText(p) {
  const bits = [];
  const v = variance(p);
  if (v.hrs > 0) bits.push(v.hrs + " extra hours (" + usd(v.$) + ")");
  const o = overrun(p);
  if (o.$ > 0) bits.push(usd(o.$) + " materials over budget");
  const ub = unbilled(p);
  if (ub > 0) bits.push(usd(ub) + " done but not billed");
  return bits.length ? bits.join(" · ") : "Slight drift — keep an eye on it.";
}

function HoursChart({ projects, onOpen }) {
  const maxHrs = Math.max(...projects.map((p) => Math.max(p.estHours, p.actualHours)));
  return (
    <div className="rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
      <div className="mb-4 flex items-center justify-between gap-3">
        <div>
          <h3 className="flex items-center gap-1.5 text-[13px] font-bold text-ink">
            <Icon name="bar-chart-3" size={14} className="text-slate-500" /> Hours: Estimated vs Actual
          </h3>
          <p className="text-[11px] text-slate-500">Longer colored bar = more hours than you quoted.</p>
        </div>
        <div className="hidden items-center gap-3 text-[10px] font-medium text-slate-500 sm:flex">
          <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-slate-400"></span>Estimated</span>
          <span className="flex items-center gap-1.5"><span className="h-2 w-2 rounded-sm bg-rose-500"></span>Actual</span>
        </div>
      </div>
      <div className="space-y-2">
        {projects.map((p) => {
          const over = p.actualHours - p.estHours;
          return (
            <button key={p.id} onClick={() => onOpen(p)}
              className="group grid w-full grid-cols-[86px_1fr_52px] items-center gap-3 rounded-lg px-2 py-1.5 text-left transition-colors hover:bg-slate-50">
              <span className={"truncate text-[11px] font-semibold " + (over > 0 ? "text-ink" : "text-slate-500")}>{p.name}</span>
              <span className="space-y-1">
                <span className="flex items-center gap-1">
                  <span className="h-2 overflow-hidden rounded-sm bg-slate-100">
                    <span className="block h-full rounded-sm bg-slate-400/80 bar-grow" style={{ width: (p.estHours / maxHrs) * 100 + "%" }} />
                  </span>
                </span>
                <span className="flex items-center gap-1">
                  <span className="h-2 overflow-hidden rounded-sm bg-slate-100">
                    <span className={"block h-full rounded-sm bar-grow " + HEALTH_META[p.health].bar} style={{ width: (p.actualHours / maxHrs) * 100 + "%" }} />
                  </span>
                </span>
              </span>
              <span className={"text-right text-[11px] font-bold tabular-nums " + (over > 0 ? "text-rose-600" : "text-slate-500")}>
                {over !== 0 ? (over > 0 ? "+" : "") + over + "h" : "on budget"}
              </span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

/* ═══════════ TAB 2 · PROJECTS ═══════════ */
function ProjectsTable({ rows, onOpen, selected }) {
  return (
    <div className="overflow-x-auto">
      <table className="w-full min-w-[720px] border-collapse text-left text-[12px]">
        <thead>
          <tr className="border-b border-slate-100 text-[10.5px] uppercase tracking-wide text-slate-400">
            <th className="px-4 py-2.5 font-semibold">Job</th>
            <th className="px-3 py-2.5 text-right font-semibold">Labor (est → actual)</th>
            <th className="px-3 py-2.5 text-right font-semibold">Materials</th>
            <th className="px-3 py-2.5 text-right font-semibold">Unbilled</th>
            <th className="px-4 py-2.5 text-right font-semibold">Status</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((p) => {
            const v = variance(p);
            const o = overrun(p);
            const ub = unbilled(p);
            const l = laborFor(p);
            const sel = selected && selected.id === p.id;
            return (
              <tr key={p.id} onClick={() => onOpen(p)}
                className={"cursor-pointer border-b border-slate-50 transition-colors last:border-0 hover:bg-slate-50/80 " + (sel ? "bg-rose-50/60" : "")}>
                <td className="px-4 py-3">
                  <div className="flex items-center gap-2.5">
                    <span className={"grid h-8 w-8 shrink-0 place-items-center rounded-lg " +
                      (p.health === "critical" ? "bg-rose-100 text-rose-600" : p.health === "warning" ? "bg-amber-100 text-amber-600" : "bg-slate-100 text-slate-500")}>
                      <Icon name={p.icon} size={14} />
                    </span>
                    <div className="min-w-0">
                      <p className="truncate text-[12.5px] font-bold text-ink">{p.name}</p>
                      <p className="text-[10.5px] text-slate-400">{p.client}</p>
                    </div>
                  </div>
                </td>
                <td className="px-3 py-3 text-right">
                  <span className="flex flex-col items-end leading-tight">
                    <span className="flex items-center gap-1 tabular-nums text-slate-500">
                      {usd(l.est)} <span className="text-slate-300">→</span>
                      <span className={"font-bold " + (v.$ > 0 ? "text-rose-600" : "text-emerald-600")}>{usd(l.act)}</span>
                    </span>
                    {v.hrs > 0 && <span className="text-[10.5px] font-semibold text-rose-500">+{hoursFmt(v.hrs)} over quote</span>}
                  </span>
                </td>
                <td className="px-3 py-3 text-right">
                  {o.$ === 0
                    ? <span className="text-[11px] font-medium text-emerald-600">On budget</span>
                    : <span className="text-[12px] font-bold tabular-nums text-amber-600">+{usd(o.$)}</span>}
                </td>
                <td className="px-3 py-3 text-right">
                  {ub === 0 ? <span className="text-[11px] text-slate-400">—</span> :
                    <span className="text-[12px] font-bold tabular-nums text-amber-600">{usd(ub)}</span>}
                </td>
                <td className="px-4 py-3 text-right">
                  <div className="flex items-center justify-end gap-1.5">
                    <span className={"hidden text-[10px] font-bold tabular-nums md:inline " + HEALTH_META[p.health].text}>{p.currentMargin}%</span>
                    <HealthBadge health={p.health} pulse={p.health === "critical"} />
                  </div>
                </td>
              </tr>
            );
          })}
          {rows.length === 0 && (
            <tr><td colSpan="5" className="px-4 py-10 text-center text-[12px] text-slate-400">No jobs match this filter.</td></tr>
          )}
        </tbody>
      </table>
    </div>
  );
}

/* ═══════════ TAB 3 · MONEY TO BILL ═══════════ */
function MoneyToBill({ projects, onMarkInvoiced }) {
  const items = useMemo(() =>
    projects
      .flatMap((p) => openCOs(p).map((co) => ({ p, co })))
      .sort((a, b) =>
        (a.co.status === "pending" ? 0 : 1) - (b.co.status === "pending" ? 0 : 1) || b.co.amount - a.co.amount),
    [projects]);

  const total = items.reduce((s, x) => s + x.co.amount, 0);
  const ready = items.filter((x) => x.co.status === "pending").reduce((s, x) => s + x.co.amount, 0);

  return (
    <div className="space-y-4">
      <div className="flex flex-col gap-3 rounded-2xl border border-slate-200 bg-white p-5 shadow-sm sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p className="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Total unbilled work</p>
          <p className="mt-1 text-[28px] font-extrabold tracking-tight tabular-nums text-amber-600">{usd(total)}</p>
          <p className="mt-0.5 text-[12px] text-slate-500">
            <span className="font-semibold text-emerald-600">{usd(ready)} signed and ready to bill now</span> · {usd(total - ready)} waiting on a signature
          </p>
        </div>
        <div className="rounded-xl bg-slate-900 px-4 py-3 text-[11px] leading-relaxed text-slate-300">
          <p className="font-bold text-white">Quick win</p>
          <p>Billing the signed work first means cash this month, not next.</p>
        </div>
      </div>

      <div className="divide-y divide-slate-100 overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
        {items.map(({ p, co }) => (
          <div key={co.id} className="flex flex-wrap items-center gap-3 px-4 py-3">

/* ═══════════ PROJECT DRAWER ═══════════ */
function whatToDo(p) {
  const bits = [];
  const unsigned = p.changeOrders.filter((c) => c.status === "unsigned");
  const pending = p.changeOrders.filter((c) => c.status === "pending");
  const v = variance(p);
  const o = overrun(p);
  if (pending.length) bits.push("Bill signed extra work: " + usd(pending.reduce((s, c) => s + c.amount, 0)));
  if (unsigned.length) bits.push("Get signatures: " + usd(unsigned.reduce((s, c) => s + c.amount, 0)) + " of change orders");
  if (v.hrs > 0) bits.push(v.hrs + "h over estimate — hold overtime until re-quoted");
  if (o.$ > 0) bits.push("Check " + usd(o.$) + " material overrun for waste or scope change");
  if (!bits.length) bits.push("Nothing to fix — job is on track");
  return bits;
}

function ProjectDrawer({ p, onClose, onMarkInvoiced }) {

  const v = variance(p);
  const o = overrun(p);

  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);

            <span className="grid h-10 w-10 place-items-center rounded-xl bg-slate-900 text-white"><Icon name={p.icon} size={18} /></span>

          </div>

        </header>

        <div className="space-y-4 px-5 py-4">
          <div className="flex items-center justify-between">
            <HealthBadge health={p.health} pulse={p.health === "critical"} />
            <span className="text-[11px] text-slate-400">Contract {usd(p.contract)}</span>
          </div>

          <div className={"rounded-xl border p-3.5 " +
            (p.health === "critical" ? "border-rose-200 bg-rose-50/70" : p.health === "warning" ? "border-amber-200 bg-amber-50/70" : "border-emerald-200 bg-emerald-50/70")}>
            <div className="flex items-center justify-between">
              <span className={"text-[11px] font-semibold uppercase tracking-wide " + HEALTH_META[p.health].text}>

              <span className={"text-lg font-extrabold tabular-nums " + HEALTH_META[p.health].text}>{usd(atRisk)}</span>
            </div>
            <p className="mt-1 text-[11px] leading-relaxed text-slate-500">Extra labor + materials + unbilled extra work on this job.</p>

          <section className="rounded-xl border border-slate-200 p-4">
            <h4 className="mb-3 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500">
              <Icon name="timer" size={13} className="text-slate-400" /> Hours & Labor
            </h4>
            <div className="mb-3 flex items-end justify-between">
              <p className="text-sm font-bold tabular-nums">{hoursFmt(p.estHours)} <span className="text-slate-400">→</span> {hoursFmt(p.actualHours)}</p>
              <span className={"text-[12px] font-bold tabular-nums " + (v.hrs > 0 ? "text-rose-600" : "text-emerald-600")}>
                {v.hrs > 0 ? "+" : ""}{usd(v.$)}

            </div>
            <div className="flex h-2.5 overflow-hidden rounded-full bg-slate-100">

                <div className={"h-full rounded-r-full " + HEALTH_META[p.health].bar} style={{ width: (p.actualHours / Math.max(p.estHours, p.actualHours)) * 50 + "%" }} />
              </div>
            </div>
            <p className="mt-2.5 text-[11px] text-slate-500">{usd(l.est)} quoted labor → {usd(l.act)} actual labor</p>

          <section className="rounded-xl border border-slate-200 p-4">
            <h4 className="mb-3 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wider text-slate-500">
              <Icon name="package" size={13} className="text-slate-400" /> Materials

            <div className="flex items-end justify-between">
              <p className="text-sm font-bold tabular-nums">{usd(p.materialBudget)} <span className="text-slate-400">→</span> {usd(p.materialActual)}</p>

          <section className="rounded-xl border border-slate-200 p-4">
            <h4 className="mb-3 text-[11px] font-bold uppercase tracking-wider text-slate-500">Extra work (change orders)</h4>
            {p.changeOrders.length === 0 && <p className="text-[11.5px] text-slate-400">None on this job.</p>}
            <div className="space-y-2">
              {p.changeOrders.map((co) => (
                <div key={co.id} className="flex items-center justify-between gap-2 rounded-lg border border-slate-100 bg-slate-50/70 px-3 py-2">
                  <div className="min-w-0">
                    <p className="truncate text-[12px] font-semibold text-slate-700">{co.title}</p>
                    <Pill className={"mt-0.5 " + CO_STATUS_META[co.status].chip}>{co.id} · {CO_STATUS_META[co.status].label}</Pill>
                  </div>
                  <div className="flex shrink-0 flex-col items-end gap-1">
                    <span className="text-[12px] font-bold tabular-nums text-slate-800">{usd(co.amount)}</span>
                    {co.status === "pending" && (
                      <button onClick={() => void onMarkInvoiced(p.id, co.id)}
                        className="rounded-md bg-slate-900 px-2 py-0.5 text-[10px] font-semibold text-white transition-colors hover:bg-slate-700">
                        Mark billed
                      </button>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </section>

          {p.health !== "healthy" && (
            <div className="rounded-xl border border-amber-200 bg-amber-50/70 p-3.5">
              <h4 className="mb-2 flex items-center gap-1.5 text-[11px] font-bold uppercase tracking-wide text-amber-700">
                <Icon name="zap" size={13} /> What to do

        </div>
      </aside>
    </div>
  );
}

/* ═══════════ APP ═══════════ */
const NAV = [
  { key: "overview", label: "Overview", icon: "layout-dashboard" },
  { key: "projects", label: "Projects", icon: "clipboard-list" },
  { key: "money",    label: "Money to Bill", icon: "file-text" },
  { key: "guide",    label: "Guide", icon: "help-circle" },
];

function App() {
  const [view, setView] = useState(() => {
    const h = (window.location.hash || "").replace("#", "");
    return NAV.some((n) => n.key === h) ? h : "overview";
  });
  const [mode, setMode] = useState(() => {
    const v = window.localStorage.getItem("mlr-mode");
    return v === "live" ? "live" : "demo";
  });
  const [projects, setProjects] = useState(mode === "demo" ? SEED_PROJECTS : []);
  const [liveSource, setLiveSource] = useState("sample");
  const [liveError, setLiveError] = useState(null);
  const [invoicedCoIds, setInvoicedCoIds] = useState(new Set());
  const [statusFilter, setStatusFilter] = useState("all");
  const [selectedId, setSelectedId] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });
  useEffect(() => {
    window.localStorage.setItem("mlr-mode", mode);
  }, [mode]);
  useEffect(() => {
    if (mode === "demo") {
      setProjects(SEED_PROJECTS);
      setLiveSource("sample");
      setLiveError(null);
      return;
    }
    const endpoint = (window.__AIRTABLE_ENDPOINT__) || "/api/projects";
    setLiveSource("loading");
    setLiveError(null);
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    fetch(endpoint, { signal: controller.signal })
      .then((r) => {
        clearTimeout(timer);
        if (!r.ok) throw new Error("HTTP " + r.status + " " + r.statusText);
        return r.json();
      })
      .then((data) => {
        clearTimeout(timer);
        setProjects(data || []);
        setLiveSource(data && data.length ? "airtable" : "empty");
      })
      .catch((err) => {
        clearTimeout(timer);
        setProjects([]);
        setLiveSource("error");
        setLiveError(
          err.name === "AbortError"
            ? "Request timed out after 15s."
            : "Failed to load data from " + endpoint + " — check the endpoint or switch to Demo Mode."
        );
      });
  }, [mode]);
  useEffect(() => {
    if (!toast) return;
    const t = window.setTimeout(() => setToast(null), 3200);
    return () => window.clearTimeout(t);
  }, [toast]);

  const go = (v) => {
    setView(v);
    try { history.replaceState(null, "", "#" + v); } catch (e) { window.location.hash = v; }
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  const notify = (msg, tone = "success") => setToast({ msg, tone });

  const markInvoiced = useCallback((projectId, coId) => {
    const wasAdded = !invoicedCoIds.has(coId);
    setInvoicedCoIds((prev) => {
      const next = new Set(prev);
      if (wasAdded) next.add(coId);
      else next.delete(coId);
      return next;
    });

    if (mode === "demo") {
      notify("Marked billed -- " + coId + " is in your invoice queue.");
      return;
    }

    fetch("/api/change-orders/" + coId, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status: "invoiced" }),
    })
      .then((r) => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        notify("Change order " + coId + " marked as invoiced.");
      })
      .catch(() => {
        setInvoicedCoIds((prev) => {
          const next = new Set(prev);
          if (wasAdded) next.delete(coId);
          else next.add(coId);
          return next;
        });
        setToast({ msg: "Could not update in Airtable - reverted local change.", tone: "danger" });
      });
  }, [mode, invoicedCoIds]);

  const displayProjects = useMemo(() => {
    if (invoicedCoIds.size === 0) return projects;
    return projects.map((p) => ({
      ...p,
      changeOrders: p.changeOrders.map((c) =>
        invoicedCoIds.has(c.id) ? { ...c, status: "invoiced" } : c
      ),
    }));
  }, [projects, invoicedCoIds]);

  const open = (p) => setSelectedId(p.id);
  const close = () => setSelectedId(null);

  const m = useMemo(() => {
    const active = displayProjects.length;
    const booked = displayProjects.reduce((s, p) => s + p.contract, 0);
    const target = 200000;
    const laborOver = displayProjects.reduce((s, p) => { const dv = variance(p).$; return s + Math.max(0, dv); }, 0);
    const hoursDelta = displayProjects.reduce((s, p) => s + Math.max(0, p.actualHours - p.estHours), 0);
    const unbilledTotal = displayProjects.reduce((s, p) => s + unbilled(p), 0);
    const openCOs = displayProjects.reduce((s, p) => s + openCOsCount(p), 0);
    const avgMargin = displayProjects.reduce((s, p) => s + p.contract * p.currentMargin, 0) / (booked || 1);
    const avgGoal = displayProjects.reduce((s, p) => s + p.contract * p.targetMargin, 0) / (booked || 1);
    return { active, booked, target, laborOver, hoursDelta, unbilled: unbilledTotal, openCOs, avgMargin, avgGoal };
  }, [displayProjects]);

  const rows = useMemo(() => {
    let out = displayProjects.filter((p) => statusFilter === "all" || p.health === statusFilter);
    const rank = { critical: 3, warning: 2, healthy: 1 };
    return [...out].sort((a, b) => rank[b.health] - rank[a.health] || leakScore(b) - leakScore(a));
  }, [displayProjects, statusFilter]);

  const counts = useMemo(() => ({
    all: displayProjects.length,
    critical: displayProjects.filter((p) => p.health === "critical").length,
    warning: displayProjects.filter((p) => p.health === "warning").length,
    healthy: displayProjects.filter((p) => p.health === "healthy").length,
  }), [displayProjects]);

  const titles = {
    overview: { t: "Overview", sub: "Where your profit is leaking across " + m.active + " active jobs." },
    projects: { t: "Projects", sub: "Every active job, biggest problems first. Tap a row for the breakdown." },
    money:    { t: "Money to Bill", sub: "Work you've done but haven't invoiced yet — your fastest cash." },
    guide:    { t: "Guide", sub: "How to use this dashboard, in plain English." },
  };

  const filterTabs = [
    { key: "all", label: "All", n: counts.all, dot: "bg-slate-500", on: "data-[on=true]:ring-slate-200 data-[on=true]:bg-slate-50 data-[on=true]:text-ink" },
    { key: "critical", label: "Losing Money", n: counts.critical, dot: "bg-rose-500", on: "data-[on=true]:ring-rose-200 data-[on=true]:bg-rose-50 data-[on=true]:text-rose-700" },
    { key: "warning", label: "Watch Out", n: counts.warning, dot: "bg-amber-500", on: "data-[on=true]:ring-amber-200 data-[on=true]:bg-amber-50 data-[on=true]:text-amber-700" },
    { key: "healthy", label: "On Track", n: counts.healthy, dot: "bg-emerald-500", on: "data-[on=true]:ring-emerald-200 data-[on=true]:bg-emerald-50 data-[on=true]:text-emerald-700" },
  ];

  const selected = selectedId ? displayProjects.find((x) => x.id === selectedId) : null;

  return (
    <div className="flex min-h-screen">
      <aside className="hidden w-60 shrink-0 flex-col bg-slate-950 text-slate-300 lg:flex">
        <a href="index.html" className="flex items-center gap-2 border-b border-slate-800/70 px-5 py-5 text-[11px] font-semibold text-slate-500 transition-colors hover:text-slate-300">
          <Icon name="arrow-left" size={13} /> Back to work
        </a>
        <div className="px-5 pt-5">
          <div className="flex items-center gap-2.5">
            <span className="grid h-9 w-9 place-items-center rounded-xl bg-white/10 ring-1 ring-white/10">
              <Icon name="droplet" size={17} className="text-rose-400" />
            </span>
            <div>
              <p className="text-[13px] font-bold text-white">Margin Leak</p>
              <p className="-mt-0.5 text-[10px] text-slate-500">Field Ops · Week 34</p>
            </div>
          </div>
        </div>
        <nav className="mt-6 flex-1 space-y-0.5 px-3">
          {NAV.map((n) => {
            const active = view === n.key;
            const badge = n.key === "projects" ? m.active : n.key === "money" ? m.openCOs : null;
            return (
              <button key={n.key} onClick={() => go(n.key)}
                className={"flex w-full items-center gap-2.5 rounded-lg px-3 py-2 text-[12.5px] font-medium transition-colors " +
                  (active ? "bg-white/10 text-white" : "text-slate-400 hover:bg-white/5 hover:text-slate-200")}>
                <Icon name={n.icon} size={15} className={active ? "text-rose-400" : ""} />
                {n.label}
                {typeof badge === "number" && badge > 0 && (
                  <span className="ml-auto rounded-md bg-white/10 px-1.5 py-0.5 text-[10px] font-bold tabular-nums text-slate-300">{badge}</span>
                )}
              </button>
            );
          })}
        </nav>
        <div className="m-3 space-y-2 rounded-xl border border-slate-800 bg-slate-900/60 p-3">
          <p className="text-[10px] font-semibold uppercase tracking-wide text-slate-500">Data source</p>
          <div className="flex gap-1 rounded-lg bg-slate-800/50 p-1">
            {MODE_OPTIONS.map((opt) => {
              const on = mode === opt.key;
              return (
                <button
                  key={opt.key}
                  onClick={() => setMode(opt.key)}
                  className={
                    "flex flex-1 items-center justify-center gap-1.5 rounded-md px-2.5 py-1.5 text-[11px] font-semibold transition-all " +
                    (on
                      ? "bg-white text-ink shadow-sm"
                      : "text-slate-500 hover:text-ink")
                  }
                >
                  <Icon name={opt.icon} size={12} />
                  {opt.label}
                </button>
              );
            })}
          </div>
          <p className="text-[10px] text-slate-400">{MODE_OPTIONS.find((o) => o.key === mode)?.sub}</p>
          {mode === "live" && (
            <div className={"flex items-center gap-1.5 rounded-lg px-2 py-1 text-[9.5px] " +
              (liveSource === "loading" ? "bg-slate-800/50 text-slate-400"
               : liveSource === "error" ? "bg-rose-900/20 text-rose-400"
               : liveSource === "empty" ? "bg-slate-800/50 text-slate-400"
               : "bg-emerald-900/20 text-emerald-300")}>
              <span className="relative flex h-1.5 w-1.5">
                <span className={"absolute inline-flex h-full w-full animate-ping rounded-full opacity-60 " +
                  (liveSource === "error" ? "bg-rose-400" : "bg-emerald-400")} />
                <span className={"relative inline-flex h-1.5 w-1.5 rounded-full " +
                  (liveSource === "error" ? "bg-rose-500" : "bg-emerald-500")} />
              </span>
              {liveSource === "loading" ? "Connecting..." : liveSource === "error" ? "Connection error" : liveSource === "empty" ? "No data found" : "Live from Airtable"}
            </div>
          )}
          {liveError && <p className="text-[9px] text-rose-400/80">{liveError}</p>}
        </div>
      </aside>

      <main className="min-w-0 flex-1">
        <div className="mx-auto max-w-6xl px-4 py-6 sm:px-6 lg:px-8">
          <header className="mb-6 flex flex-wrap items-center gap-3">
            <a href="index.html" className="flex items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[11px] font-semibold text-slate-500 shadow-sm transition-colors hover:text-ink lg:hidden">
              <Icon name="arrow-left" size={12} /> Portfolio
            </a>
            <div className="min-w-0">
              <h1 className="flex items-center gap-2 text-[19px] font-extrabold tracking-tight text-ink">
                <Icon name="droplet" size={19} className="text-rose-500 lg:hidden" />
                {titles[view].t}
              </h1>
              <p className="mt-0.5 text-[12px] text-slate-500">{titles[view].sub}</p>
            </div>
            <span className="hidden rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-[11px] font-medium text-slate-500 shadow-sm sm:inline-flex sm:items-center sm:gap-1.5">
              <Icon name="calendar" size={12} /> {new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}
            </span>
          </header>

          <nav className="mb-5 flex gap-1 overflow-x-auto rounded-xl border border-slate-200 bg-white p-1 shadow-sm lg:hidden" role="tablist">
            {NAV.map((n) => (
              <button key={n.key} onClick={() => go(n.key)} role="tab" aria-selected={view === n.key}
                className={"flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-[11.5px] font-semibold transition-colors " +
                  (view === n.key ? "bg-slate-900 text-white" : "text-slate-500 hover:text-ink")}>
                <Icon name={n.icon} size={13} /> {n.label}
              </button>
            ))}
          </nav>

          {(mode === "live" && (liveSource === "loading" || liveSource === "error" || liveSource === "empty")) ? (
            <div className="flex min-h-[60vh] items-center justify-center">
              <div className="text-center">
                <div className="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-xl bg-slate-100 text-slate-400">
                  <Icon name="store" size={20} />
                </div>
                <h3 className="mb-1 text-[15px] font-bold text-slate-700">
                  {liveSource === "loading" ? "Connecting to Airtable..." : liveSource === "error" ? "Connection error" : "No live data found"}
                </h3>
                <p className="max-w-sm text-[12px] text-slate-500">
                  {liveSource === "loading"
                    ? "Fetching your live job costing data."
                    : "Live mode is enabled but no data was returned. Check your Airtable connection or switch to Demo Mode."}
                </p>
                {liveSource === "error" && liveError && (
                  <p className="mt-2 text-[10px] text-rose-500">{liveError}</p>
                )}
              </div>
            </div>
          ) : (
            <>
              {view === "overview" && (
                <>
                  <KpiCards m={m} onGo={go} />
                  <section className="mt-5 grid grid-cols-1 gap-4 lg:grid-cols-5">
                    <div className="lg:col-span-3"><HoursChart projects={displayProjects} onOpen={open} /></div>
                    <div className="lg:col-span-2"><AttentionList projects={displayProjects} onOpen={open} /></div>
                  </section>
                </>
              )}

          {view === "projects" && (
            <section className="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
              <div className="flex flex-wrap items-center gap-3 border-b border-slate-100 px-4 py-3">
                <h2 className="text-[13px] font-bold text-ink">Active Jobs</h2>
                <div className="ml-auto flex items-center gap-1 rounded-lg bg-slate-100 p-0.5">
                  {filterTabs.map((t) => (
                    <button key={t.key} data-on={statusFilter === t.key} onClick={() => setStatusFilter(t.key)}
                      className={"flex items-center gap-1 rounded-md px-2 py-1 text-[11px] font-semibold text-slate-500 transition-colors hover:text-ink data-[on=true]:bg-white data-[on=true]:shadow-sm " + t.on}>
                      <span className={"h-1.5 w-1.5 rounded-full " + t.dot} />{t.label}
                      <span className="tabular-nums text-slate-400">{t.n}</span>
                    </button>
                  ))}
                </div>
              </div>
              <ProjectsTable rows={rows} onOpen={open} selected={selected} />
              <footer className="flex flex-wrap items-center justify-between gap-2 border-t border-slate-100 px-4 py-2.5 text-[11px] text-slate-400">
                <span>Showing <span className="font-semibold text-slate-600">{rows.length}</span> of {displayProjects.length} jobs · tap a row for details</span>
                <span>Biggest leaks first</span>
              </footer>
            </section>
          )}

          {view === "money" && <MoneyToBill projects={displayProjects} onMarkInvoiced={markInvoiced} />}

          {view === "guide" && <Guide onGo={go} />}

          <footer className="mt-8 text-center text-[11px] text-slate-400">
            Margin Leak Report · {mode === "demo" ? "prototype with sample data" : "connected to Airtable"} · tap any job to open its breakdown.
          </footer>
            </>
          )}
        </div>
      </main>

      {selected && <ProjectDrawer p={selected} onClose={close} onMarkInvoiced={markInvoiced} />}

      {toast && (
        <div className="fixed bottom-5 left-1/2 z-50 -translate-x-1/2">
          <div className={"flex items-center gap-2 rounded-xl border bg-white/95 px-4 py-2.5 text-[12px] font-medium shadow-2xl backdrop-blur " +
            (toast.tone === "danger" ? "border-rose-300 text-rose-700" : "border-emerald-300 text-emerald-700")}>
            {toast.tone === "danger" ? <Icon name="alert-triangle" size={14} /> : <Icon name="check-circle-2" size={14} />}
            {toast.msg}
          </div>
        </div>
      )}
    </div>
  );
}

/* Helper: count of open (unbilled) change orders for one project — named to avoid shadowing. */
function openCOsCount(p) {
  return p.changeOrders.filter((c) => c.status !== "invoiced").length;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
